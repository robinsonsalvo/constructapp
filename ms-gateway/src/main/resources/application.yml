spring:
  application:
    name: ms-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:constructapp-secret-key-2025-muy-larga-para-seguridad}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    gateway:
      routes:
        - id: ms-auth
          uri: http://localhost:8091
          predicates:
            - Path=/api/auth/**

        - id: ms-catalogo
          uri: http://localhost:8081
          predicates:
            - Path=/api/categorias/**, /api/materiales/**

        - id: ms-cliente
          uri: http://localhost:8082
          predicates:
            - Path=/api/clientes/**

        - id: ms-proveedor-material
          uri: http://localhost:8083
          predicates:
            - Path=/api/proveedores-material/**

        - id: ms-proveedor-servicio
          uri: http://localhost:8084
          predicates:
            - Path=/api/proveedores-servicio/**

        - id: ms-resena
          uri: http://localhost:8085
          predicates:
            - Path=/api/resenas/**

        - id: ms-proyecto
          uri: http://localhost:8086
          predicates:
            - Path=/api/proyectos/**

        - id: ms-calculo-material
          uri: http://localhost:8087
          predicates:
            - Path=/api/calculos-material/**

        - id: ms-cotizacion
          uri: http://localhost:8088
          predicates:
            - Path=/api/cotizaciones/**

        - id: ms-comparacion-precios
          uri: http://localhost:8089
          predicates:
            - Path=/api/comparacion-precios/**

        - id: ms-orden-trabajo
          uri: http://localhost:8090
          predicates:
            - Path=/api/ordenes-trabajo/**

eureka:
  client:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    gateway:
      routes:
        - id: ms-auth
          uri: ${MS_AUTH_URL:http://ms-auth:8091}
          predicates:
            - Path=/api/auth/**

        - id: ms-catalogo
          uri: ${MS_CATALOGO_URL:http://ms-catalogo:8081}
          predicates:
            - Path=/api/categorias/**, /api/materiales/**

        - id: ms-cliente
          uri: ${MS_CLIENTE_URL:http://ms-cliente:8082}
          predicates:
            - Path=/api/clientes/**

        - id: ms-proveedor-material
          uri: ${MS_PROVEEDOR_MATERIAL_URL:http://ms-proveedor-material:8083}
          predicates:
            - Path=/api/proveedores-material/**

        - id: ms-proveedor-servicio
          uri: ${MS_PROVEEDOR_SERVICIO_URL:http://ms-proveedor-servicio:8084}
          predicates:
            - Path=/api/proveedores-servicio/**

        - id: ms-resena
          uri: ${MS_RESENA_URL:http://ms-resena:8085}
          predicates:
            - Path=/api/resenas/**

        - id: ms-proyecto
          uri: ${MS_PROYECTO_URL:http://ms-proyecto:8086}
          predicates:
            - Path=/api/proyectos/**

        - id: ms-calculo-material
          uri: ${MS_CALCULO_MATERIAL_URL:http://ms-calculo-material:8087}
          predicates:
            - Path=/api/calculos-material/**

        - id: ms-cotizacion
          uri: ${MS_COTIZACION_URL:http://ms-cotizacion:8088}
          predicates:
            - Path=/api/cotizaciones/**

        - id: ms-comparacion-precios
          uri: ${MS_COMPARACION_PRECIOS_URL:http://ms-comparacion-precios:8089}
          predicates:
            - Path=/api/comparacion-precios/**

        - id: ms-orden-trabajo
          uri: ${MS_ORDEN_TRABAJO_URL:http://ms-orden-trabajo:8090}
          predicates:
            - Path=/api/ordenes-trabajo/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://ms-eureka-server:8761/eureka/}
